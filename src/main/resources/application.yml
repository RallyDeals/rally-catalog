deal:
  service:
    url: ${DEAL_SERVICE_URL:http://localhost:8085}
    mock:
      has-active-deal: ${DEAL_SERVICE_MOCK_HAS_ACTIVE_DEAL:false}

app:
  storage:
    root: ${STORAGE_ROOT:./uploads}

spring:
  application:
    name: rally-catalog

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:catalog_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8
    baseline-description: reverted_and_rebaselined

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8083

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id
      tag-fields: X-Correlation-Id
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.rally.catalog: ${LOGGING_LEVEL_RALLY:INFO}
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.apache.kafka: WARN
    org.apache.kafka.clients.producer: OFF
    org.apache.kafka.clients.consumer: OFF
    org.springframework.kafka: WARN
    org.springframework: WARN
    org.springframework.boot: WARN
    org.flywaydb: WARN

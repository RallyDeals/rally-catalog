services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: .
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR}
      secrets:
        - github_token
    container_name: catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5432
      DB_NAME: catalog_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DEAL_SERVICE_URL: http://deal-service:8081   # 👈 added this
    ports:
      - "8083:8083"

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  catalog-db-data:

networks:
  default:
    name: groupdeal-net
    external: true
